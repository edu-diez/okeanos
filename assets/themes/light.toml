# okeanos TUI Theme - Light Mode
# Design tokens per tui-design.md §2, §8

# Canvas colors
[canvas]
bg = "#f8fafc"        # Off-white
fg = "#0f172a"        # Primary foreground (dark)
muted = "#475569"     # Muted text, timestamps, retry counts
border = "#cbd5e1"    # Structural borders
code_block_bg = "#eef2f7"  # Slightly darker than bg for code blocks

# Semantic colors - paired with glyphs for accessibility
# Lightness shifted for light canvas (darker accents)
[semantic]
ok = "#15803d"        # Successful tool result, completed todo (✓) - ~4.7:1 AA
warn = "#b45309"      # Retrying, rate-limit warning, stale snapshot (⚠) - ~4.6:1 AA
error = "#b91c1c"     # Failed tool call, auth error, parse error (✗) - ~6.3:1 AAA
pending = "#475569"   # In-progress stream, queued call (⟳) - ~6.8:1 AAA
tool = "#4338ca"      # Tool-call name, args chip - ~7.3:1 AAA
system = "#475569"    # Log lines, file paths, meta text - ~6.8:1 AAA
user = "#0f172a"      # User message bubble - ~17.8:1 AAA
assistant = "#4338ca" # Assistant message bubble - ~7.3:1 AAA

# Typography scales (relative to body)
[typography]
heading_scale = 1.1   # Pane titles, modal titles
label_scale = 0.9     # Chip labels ("tool", "ok")
body_scale = 1.0      # Message text, args, results
mono_data_scale = 0.9 # JSON, file paths, diff hunks
muted_scale = 0.9     # Timestamps, retry counts, log tail

# Spacing (in character cells)
[spacing]
unit = 1
gap_small = 1
gap_medium = 2
pad = 1
modal_pad = 2

# Frame styles (unicode box-drawing)
[frames]
single = "single"     # ┌─┐│└┘
double = "double"     # ╔═╗║╚╝
rounded = "rounded"   # ╭─╮│╰╯
ascii = "ascii"       # +-+|++ (legacy fallback)

# Animation durations (milliseconds)
[animation]
modal = 180           # Modal open/close slide-in + fade
typing_cycle = 600    # Typing indicator pulse cycle
spinner_frame = 100   # Braille spinner frame duration
badge = 150           # Status badge color cross-fade
progress = 0          # Linear (no easing)

# Layer z-order (for overlay rendering)
[layers]
background = 0
pane = 1
right_rail = 2
status_bar = 3
modal = 4
command_palette = 5

# Breakpoints (terminal cells)
[breakpoints]
width_min = 80
width_comfortable = 120
height_min = 24
height_comfortable = 40

# Reduced motion: when true, all animations disabled
[reduced_motion]
enabled = false