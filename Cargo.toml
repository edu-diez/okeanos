[package]
name = "okeanos"
description = "Autonomous coding agent harness"
version = "0.12.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "okeanos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.43", features = ["rt", "macros", "time", "signal", "process", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
futures = "0.3"
regex = "1.10"
once_cell = "1.19"
dirs = "5.0"
shellexpand = "3.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
bytes = "1"
uuid = { version = "1.8", features = ["v4", "serde"] }
nix = { version = "0.28", features = ["signal"] }
atty = "0.2"
async-stream = "0.3"
zstd = "0.13"
fd-lock = "3.0"
flate2 = "1.0"
gix = { version = "0.71", features = ["dirwalk", "gix-worktree-stream"] }



# Optional dependencies (feature-flagged)
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
tempfile = { version = "3.15", optional = true }
jsonrpsee = { version = "0.24", optional = true, features = ["ws-client", "http-client", "server"] }
futures-util = { version = "0.3", optional = true }
http = { version = "1.2", optional = true }
rmcp = { version = "3.11", optional = true, features = ["client", "transport-child-process", "schemars"] }
pulldown-cmark = { version = "0.12", optional = true }
syntect = { version = "5.0", optional = true, default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3.15"

[features]
default = ["tui", "config-file"]
tui = ["ratatui", "crossterm"]
config-file = ["toml"]
rpc = ["jsonrpsee", "http", "futures-util"]
mcp = ["rmcp"]
mock-provider = []
simd-json = []
markdown = ["pulldown-cmark", "syntect", "tui"]

[workspace]