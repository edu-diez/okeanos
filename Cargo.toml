[package]
name = "okeanos"
description = "Autonomous coding agent harness"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "okeanos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.43", features = ["rt", "macros", "time", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
futures = "0.3"
regex = "1.10"
once_cell = "1.19"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
bytes = "1"
nix = { version = "0.28", features = ["signal"] }

# Optional dependencies (feature-flagged)
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
tempfile = { version = "3.15", optional = true }

[dev-dependencies]
tempfile = "3.15"

[features]
default = []
tui = ["ratatui", "crossterm"]
mcp = []
mock-provider = []
simd-json = []

[workspace]