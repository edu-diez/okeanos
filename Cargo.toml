[package]
name = "okeanos"
description = "Autonomous coding agent harness"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "okeanos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Optional dependencies (feature-flagged)
gix = { version = "0.70", optional = true }
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
jsonrpsee = { version = "0.22", optional = true }
# ripgrep library crates (pure Rust, no C deps) for selective context / symbol scanning
grep-regex = { version = "0.1", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-matcher = { version = "0.1", optional = true }
tempfile = { version = "3.15", optional = true }

[features]
default = []
rpc = ["jsonrpsee"]
mcp = []
mock-provider = []
simd-json = []
grep = ["grep-regex", "grep-searcher", "grep-matcher"]

[workspace]