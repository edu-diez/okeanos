name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-test-${{ matrix.os }}

      - name: Run tests
        run: cargo test --all-features

  build-matrix:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: okeanos-x86_64-unknown-linux-gnu
            musl: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: okeanos-x86_64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: okeanos-x86_64-apple-darwin
            musl: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: okeanos-aarch64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: okeanos-x86_64-pc-windows-msvc
            musl: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux musl only)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features "rpc mcp otel markdown"

      - name: Package (tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          NAME="okeanos-${{ matrix.target }}"
          mkdir -p "dist/${NAME}" artifacts
          cp "target/${{ matrix.target }}/release/okeanos" LICENSE README.md "dist/${NAME}/"
          tar -czf "artifacts/${NAME}.tar.gz" -C dist "${NAME}"

      - name: Package (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $name = "okeanos-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name", artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/okeanos.exe", LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "artifacts/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          retention-days: 7

  release:
    name: Create Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: okeanos-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          ls -la
          sha256sum okeanos-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false