name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-test-${{ matrix.os }}

      - name: Run tests
        run: cargo test --all-features

  build-matrix:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: okeanos-x86_64-unknown-linux-gnu
            musl: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: okeanos-x86_64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: okeanos-x86_64-apple-darwin
            musl: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: okeanos-aarch64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: okeanos-x86_64-pc-windows-msvc
            musl: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux musl only)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          BINARY="okeanos"
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            EXT=".exe"
          fi
          ARTIFACT_DIR="target/${{ matrix.target }}/release"
          mkdir -p artifacts
          # Include the target triple before the extension so Windows binaries
          # end up as 'okeanos-x86_64-pc-windows-msvc.exe' not 'okeanos.exe-x86_64-pc-windows-msvc'.
          cp "${ARTIFACT_DIR}/${BINARY}${EXT}" "artifacts/${BINARY}-${{ matrix.target }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          retention-days: 7

  release:
    name: Create Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: okeanos-*
          merge-multiple: false

      - name: Verify artifacts
        run: |
          ls -la release-assets/
          for dir in release-assets/okeanos-*/; do
            echo "Checking $dir"
            ls -la "$dir"
            file "$dir"/okeanos* 2>/dev/null || true
          done

      - name: Create checksums
        run: |
          cd release-assets
          for dir in okeanos-*/; do
            # Extract target triple from directory name (e.g., "okeanos-x86_64-unknown-linux-gnu")
            target=$(basename "$dir" | sed 's/^okeanos-//')
            (cd "$dir" && sha256sum okeanos* > "SHA256SUMS-${target}.txt" 2>/dev/null || shasum -a 256 okeanos* > "SHA256SUMS-${target}.txt")
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/okeanos-*/*
          generate_release_notes: true
          draft: false
          prerelease: false